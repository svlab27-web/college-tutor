<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой колледж — кабинет преподавателя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Тема и язык до первой отрисовки (как в кабинете студента)
(function(){
  const tg=window.Telegram&&window.Telegram.WebApp,inTg=!!(tg&&tg.initData);
  const dark=inTg?tg.colorScheme==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  let lang=null;try{lang=localStorage.getItem('my-college-lang')}catch(e){}
  if(lang!=='ru'&&lang!=='kk'){const u=inTg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;lang=u&&/^kk/i.test(u.language_code||'')?'kk':'ru'}
  document.documentElement.lang=lang;
})();
</script>
<style>
:root{--ink:#182c29;--muted:#687872;--green:#21614c;--lime:#e0ef94;--bg:#f5f6f1;--line:#dfe5dc;--card:#fff;--soft:#f3f5ee;--warn-bg:#fff1e6;--warn:#8c491f;--ok-bg:#edf5e4;--ok:#355632;--violet-bg:#eceaf6;--violet:#4b4880}
html[data-theme=dark]{--ink:#e4ebe6;--muted:#9fb0a7;--green:#5fae8a;--lime:#c9de6e;--bg:#121916;--line:#2b3832;--card:#1a231f;--soft:#222c27;--warn-bg:#3a2518;--warn:#f2b48c;--ok-bg:#1f3020;--ok:#b9dcae;--violet-bg:#26243a;--violet:#c9c6ef;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;letter-spacing:-.6px}
.logo-mark{width:32px;height:32px;border-radius:10px;background:#21614c;color:#e0ef94;display:grid;place-items:center;font-size:20px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--ink)}
.demo-badge{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:3px 8px}
.lang-switch{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
.lang-switch button{border:0;background:none;padding:4px 9px;border-radius:16px;font-size:11px;font-weight:700;color:var(--muted)}
.lang-switch button.active{background:#21614c;color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 18px;padding:0 16px;scrollbar-width:none}
nav button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;white-space:nowrap;font-size:13px;color:var(--muted)}
nav button.active{background:#21614c;border-color:#21614c;color:#fff;font-weight:700}
.count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:700;text-align:center}
nav button.active .count{background:#fff;color:#21614c}
h1{font-size:26px;letter-spacing:-.6px;margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.primary{background:#21614c;color:#fff}.secondary{background:var(--soft);color:var(--green)}.plain{background:none;color:var(--muted)}
.lime{background:var(--lime);color:#25452e}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-draft{background:var(--warn-bg);color:var(--warn)}.t-none{background:var(--soft);color:var(--muted)}.t-violet{background:var(--violet-bg);color:var(--violet)}
.link{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 10px;word-break:break-all;margin:10px 0}
.muted{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:24px;letter-spacing:-.5px}.tile span{font-size:12px;color:var(--muted)}
.tile.alert b{color:#c05a32}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#21614c;border-radius:5px}
.bar.low i{background:#c05a32}.bar.mid i{background:#c9a43a}
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px}
.stuck td:first-child{box-shadow:inset 3px 0 0 #c05a32}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input.i,select.i{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--card)}
.form{display:grid;grid-template-columns:2fr 1.4fr 1fr auto;gap:10px;align-items:end}
.topic{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.topic:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:12px;margin:10px auto;width:max-content}
.modal-bg{position:fixed;inset:0;background:#15251c80;display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:16px;max-width:520px;width:100%;padding:20px;max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin:0 0 6px;font-size:20px}
.draft-box{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;margin:10px 0}
.draft-box p{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#203f32;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.hidden{display:none!important}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:20px}
footer{margin-top:28px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}footer a{color:var(--muted)}
@media(max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}h1{font-size:22px}.who .name{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="logo-mark">↗</span><span data-t="brand"></span></div>
    <span class="demo-badge" data-t="demo"></span>
    <div class="who"><div class="lang-switch" role="group" aria-label="Язык · Тіл"><button type="button" data-lang="ru">РУС</button><button type="button" data-lang="kk">ҚАЗ</button></div><span class="name" id="t-name"></span><span class="avatar" id="t-ava"></span></div>
  </header>
  <nav id="tabs" aria-label="Разделы кабинета"></nav>
  <main id="view"></main>
  <footer><a href="index.html?role=student" data-t="asStudent"></a><a href="index.html?choose" data-t="switchRole"></a><a href="about.html" data-t="about"></a></footer>
</div>
<div id="modal" class="modal-bg hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="teacher.js"></script>
</body>
</html>
