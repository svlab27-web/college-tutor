<script>
// Прототип: ошибки показываем прямо на экране — в Telegram на телефоне нет консоли
(function(){
  function show(text){
    if(!document.body){document.addEventListener('DOMContentLoaded',()=>show(text));return}
    const box=document.getElementById('js-errors')||document.body.appendChild(Object.assign(document.createElement('pre'),{id:'js-errors'}));
    box.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;max-height:40vh;overflow:auto;margin:0;padding:10px;border-radius:8px;background:#7a1f1f;color:#fff;font:11px/1.4 ui-monospace,monospace;white-space:pre-wrap';
    box.textContent+=text+'\n';
  }
  window.addEventListener('error',e=>show('Ошибка: '+e.message+(e.lineno?' (строка '+e.lineno+':'+e.colno+')':'')+(e.error&&e.error.stack?'\n'+e.error.stack:'')));
  window.addEventListener('unhandledrejection',e=>show('Ошибка: '+(e.reason&&e.reason.message||e.reason)));
})();
</script>

<script>
// Тема: в Telegram — как в Telegram, в браузере — как в системе
(function(){
  const set=d=>{document.documentElement.dataset.theme=d?'dark':'light'};
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg&&tg.initData){set(tg.colorScheme==='dark');tg.onEvent('themeChanged',()=>set(tg.colorScheme==='dark'));return}
  const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  if(mq){set(mq.matches);mq.addEventListener&&mq.addEventListener('change',e=>set(e.matches))}
})();
</script>

const ids=Object.keys(courses);
function fresh(){return {step:0,completed:[],attempts:[0,0,0,0],hints:[0,0,0,0],answers:{},selected:{},operator:'>',labRuns:0,labPassed:false,finalFirstTry:false,finished:false,events:[],lab:{},reviewed:false}}
let all=Object.fromEntries(ids.map(id=>[id,fresh()])),active='python',view='home',storageOK=true,feedback=null;
function valid(s){return s&&Number.isInteger(s.step)&&s.step>=0&&s.step<=4&&Array.isArray(s.completed)&&s.completed.every(i=>Number.isInteger(i)&&i>=0&&i<4)&&['attempts','hints'].every(k=>Array.isArray(s[k])&&s[k].length===4&&s[k].every(n=>Number.isInteger(n)&&n>=0))&&Array.isArray(s.events)}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.version===2){ids.forEach(id=>{if(valid(saved.courses?.[id]))all[id]={...fresh(),...saved.courses[id]}});if(ids.includes(saved.active))active=saved.active}else{const old=JSON.parse(localStorage.getItem('shag-python-demo-v1')||'null');if(old?.version===1&&valid(old.data)){all.python={...fresh(),...old.data};all.python.answers.final=all.python.answers.finalPay??all.python.answers.final}}}catch(e){storageOK=false}
const s=()=>all[active],c=()=>courses[active];
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:2,active,courses:all}))}catch(e){storageOK=false}}
function esc(x){return String(x).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]))}
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n);
const number=v=>String(v).trim()===''?NaN:Number(String(v).trim().replace(',','.'));
function log(type,detail){s().events.push({time:new Date().toISOString(),step:s().step,type,detail});s().events=s().events.slice(-100);save()}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2800)}
function msg(text,type='neutral'){feedback={text,type};}
function message(){return feedback?`<div class="feedback ${feedback.type}" role="status">${esc(feedback.text)}</div>`:''}
function finishStep(){if(!s().completed.includes(s().step)){s().completed.push(s().step);log('completed',c().skills[s().step])}save()}
function done(){return s().completed.includes(s().step)}
function goCourse(id){if(!ids.includes(id))return;active=id;view='lesson';feedback=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function titleRow(kicker,title,sub){return `<div class="title-row"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><span class="pill"><span class="demo-dot"></span>В своём темпе</span></div>`}
function home(){const count=ids.filter(id=>all[id].finished).length,total=ids.reduce((n,id)=>n+all[id].completed.length,0);return `<div class="view">${titleRow('Учебная мастерская','Мой колледж','Четыре дисциплины. Свой маршрут в каждой.')}<section class="welcome"><div><div class="eyebrow">Твой следующий шаг</div><h2>Понимать. Пробовать.<br>Применять на практике.</h2><p>Выбери предмет и реши небольшую задачу из жизни.<br>Тьютор поможет, если станет трудно.</p><button class="btn welcome-btn" data-course="${active}">${s().step||s().completed.length?'Продолжить':'Начать'}: ${c().name} →</button></div><div class="welcome-stats"><strong>${total}<span> / 16</span></strong><p>учебных шагов пройдено</p><div class="home-track"><span style="width:${total/16*100}%"></span></div><small>${count} из 4 миссий завершено</small></div></section><div class="section-heading"><h2>Мои дисциплины</h2><span class="small">Короткие занятия · Практика · Обратная связь</span></div><div class="course-grid">${ids.map((id,i)=>{const d=courses[id],st=all[id];return `<article class="course-card" style="--course:${d.color}"><div class="course-card-top"><span class="subject-icon">${esc(d.icon)}</span><span class="small">${d.duration}</span></div><div class="eyebrow">Дисциплина 0${i+1}</div><h2>${d.name}</h2><span class="topic-label">${d.tag}</span><h3>${d.mission}</h3><p>${d.description}</p><div class="course-progress"><span>${st.finished?'Миссия завершена':st.completed.length?'Занятие в процессе':'Можно начинать'}</span><span>${st.completed.length}/4</span></div><div class="home-track"><span style="width:${st.completed.length*25}%;background:${d.color}"></span></div><button class="btn course-open" data-course="${id}">${st.finished?'Посмотреть результат':st.completed.length||st.step?'Продолжить занятие':'Открыть дисциплину'} <span>→</span></button></article>`}).join('')}</div></div>`}
function hero(){return `<section class="hero" style="background:${c().color}"><div><div class="eyebrow">${c().tag}</div><h2>${c().mission}</h2><p>${c().description}</p><div class="hero-tags"><span>4 учебных шага</span><span>≈ ${c().duration}</span></div></div><div class="subject-visual" aria-hidden="true"><span>${esc(c().icon)}</span><small>${active==='python'?'if → проба → результат':active==='math'?'S′(x) = 0':active==='tech'?'20 ± 0,2 мм':'Слушай → уточняй → помогай'}</small></div></section>`}
function choices(options,key=s().step){return `<div class="choices" role="group" aria-label="Варианты ответа">${options.map((text,i)=>`<button class="choice ${s().selected[key]===i?'selected':''}" data-choice="${i}" aria-pressed="${s().selected[key]===i}"><span class="choice-label">${i+1}</span>${esc(text)}</button>`).join('')}</div>`}
function next(){return `<button class="btn primary" data-action="next">${s().step===3?'Посмотреть результат':'Продолжить'} →</button>`}
function checkButton(){return `<div class="actions">${done()?next():`<button class="btn primary" data-action="check" ${s().selected[s().step]===undefined?'disabled':''}>${s().step===3?'Проверить себя':'Проверить ответ'} →</button>`}</div>`}
function question(){const q=s().step===3?c().final:c().questions[s().step];return `<h2>${q.title}</h2><p class="lesson-copy">${q.text}</p>${q.code?`<div class="code">${esc(q.code)}</div>`:''}${s().step===3?'<span class="status">Без подсказок в этом шаге</span>':''}${choices(q.options)}${q.label?`<label for="final-answer" class="field-label">${q.label}</label><input id="final-answer" class="input" inputmode="decimal" autocomplete="off" value="${esc(s().answers.final??'')}" placeholder="Твой ответ">`:''}${message()}${checkButton()}${s().step===3?'<p class="small" style="margin-top:14px">Попытки записываются отдельно. Обращение к справочнику или тренировке также отмечается в отчёте.</p>':''}`}
function labFooter(){return `${message()}<div class="actions">${done()?next():'<span class="small">Заверши практику, чтобы перейти к самостоятельной задаче.</span>'}</div>`}
function labPython(){const st=s(),r=st.lab.result;return `<h2>Исправь условие. Испытай кассу.</h2><p class="lesson-copy">Скидка 10% действует при сумме от 1 000 ₸ включительно. Выбери знак сравнения.</p><div class="code">total = сумма_заказа\nif total <select id="operator" aria-label="Знак сравнения" ${done()?'disabled':''}>${['>','>=','<','=='].map(x=>`<option value="${esc(x)}" ${st.operator===x?'selected':''}>${esc(x)}</option>`).join('')}</select> 1000:\n    pay = total * 0.9\nelse:\n    pay = total</div><div class="lab"><label for="total">Сумма заказа, ₸</label><div class="lab-controls"><input id="total" class="input" type="number" min="0" max="1000000" value="${esc(st.lab.total??1000)}"><button class="btn secondary" data-action="run">▷ Запустить</button></div><div class="lab-result"><span>К оплате</span><strong aria-live="polite">${r===undefined?'—':fmt(r)+' ₸'}</strong></div></div><button class="btn secondary" data-action="lab-check" ${done()?'disabled':''}>Проверить на 4 заказах</button>${st.lab.rows?`<table class="test-table"><thead><tr><th>Заказ</th><th>Ожидание</th><th>Результат</th></tr></thead><tbody>${st.lab.rows.map(r=>`<tr><td>${fmt(r.n)}</td><td>${fmt(r.expected)}</td><td>${r.actual===r.expected?'✓':'✕'} ${fmt(r.actual)}</td></tr>`).join('')}</tbody></table>`:''}${labFooter()}`}
function mathPreview(){const x=Number(s().lab.x??5),y=20-x,area=x*y,d=20-2*x;return `<div class="yard-canvas"><div class="yard" style="width:${x*10}px;height:${y*10}px"><span>${fmt(x)} × ${fmt(y)} м</span></div></div><div class="lab-readings"><div><small>Площадь</small><strong>${fmt(area)} м²</strong></div><div><small>Производная</small><strong>${fmt(d)}</strong></div><div><small>Изменение S</small><strong>${d>0?'Растёт':d<0?'Убывает':'Максимум'}</strong></div></div>`}
function labMath(){return `<h2>Найди лучшую форму двора</h2><p class="lesson-copy">Меняй сторону x. Вторая сторона автоматически равна 20 − x, периметр остаётся 40 м.</p><div class="lab"><label for="yard-x">Сторона x: <strong id="yard-value">${fmt(s().lab.x??5)}</strong> м</label><input id="yard-x" type="range" min="1" max="19" step="1" value="${s().lab.x??5}" style="width:100%;accent-color:${c().color}"><div id="math-preview" aria-live="polite">${mathPreview()}</div></div><label class="field-label" for="math-answer">При каком x площадь максимальна, м?</label><input id="math-answer" class="input" inputmode="decimal" value="${esc(s().lab.answer??'')}" placeholder="Сторона x" ${done()?'disabled':''}><div class="actions"><button class="btn secondary" data-action="lab-check" ${done()?'disabled':''}>Проверить гипотезу</button></div>${labFooter()}`}
const sizes=[19.7,19.8,20.2,20.3];
function measurePreview(){const n=Number(s().lab.measure??20);return `<div class="lab-result"><span>Размер <strong>${fmt(n)} мм</strong></span><span class="status">${n>=19.8&&n<=20.2?'В допустимом интервале':'За пределами интервала'}</span></div>`}
function labTech(){return `<h2>Проверь четыре детали</h2><p class="lesson-copy">По учебному чертежу допустимы размеры от 19,8 до 20,2 мм включительно. Сначала попробуй виртуальный измеритель.</p><div class="lab"><label for="measure">Измеренный размер, мм</label><input id="measure" type="range" min="19.5" max="20.5" step="0.05" value="${s().lab.measure??20}" style="width:100%;accent-color:${c().color}"><div id="measure-preview" aria-live="polite">${measurePreview()}</div></div><div class="batch">${sizes.map((n,i)=>`<div class="batch-row"><label for="part-${i}">Деталь ${i+1}<strong>${fmt(n)} мм</strong></label><select id="part-${i}" class="part-select input" data-part="${i}" ${done()?'disabled':''}><option value="">Выбери решение</option><option value="yes" ${s().lab.parts?.[i]==='yes'?'selected':''}>Подходит</option><option value="no" ${s().lab.parts?.[i]==='no'?'selected':''}>Вне допуска</option></select></div>`).join('')}</div><div class="actions"><button class="btn secondary" data-action="lab-check" ${done()?'disabled':''}>Проверить партию</button></div>${labFooter()}`}
const dialogs=[{client:'Я заказал синий рюкзак, а получил красный. Мне нужен был именно синий!',options:['Цвет не так важен, оставьте этот','Понимаю, цвет был важен. Давайте сверим заказ.','Я точно заменю его сегодня'],correct:1,reply:'Да, давайте проверим.',explain:'Ты признал неудобство и предложил проверить факты.'},{client:'Что вам нужно для проверки?',options:['Номер заказа и название полученного товара','Пароль от вашего аккаунта','Сначала успокойтесь'],correct:0,reply:'В учебном заказе №104 указан синий рюкзак. Получен красный.',explain:'Ты запросил нужные сведения без лишних личных данных.'},{client:'Что теперь делать?',options:['Просто подождите, когда-нибудь решим','Ничего уже не изменить','Я сверю данные и уточню доступные варианты замены. Подойдёт?'],correct:2,reply:'Да, спасибо. Буду ждать информацию о вариантах.',explain:'Есть конкретный следующий шаг без непроверенного обещания.'}];
function labService(){const i=s().lab.turn??0,d=dialogs[i];return `<h2>Пройди диалог с клиентом</h2><p class="lesson-copy">Три реплики. Выбирай ответ по смыслу, а после ошибки можно попробовать иначе.</p><div class="dialog-history">${(s().lab.history||[]).map(h=>`<div class="dialog-line student"><small>Ты</small>${esc(h.you)}</div><div class="dialog-line client"><small>Клиент</small>${esc(h.reply)}</div>`).join('')}</div>${d?`<div class="dialog-line client"><small>Клиент · Реплика ${i+1} из 3</small>${d.client}</div><div class="choices">${d.options.map((text,n)=>`<button class="choice" data-reply="${n}"><span class="choice-label">${n+1}</span>${text}</button>`).join('')}</div>`:'<div class="concept">Диалог завершён. Клиент знает, что будет происходить дальше.</div>'}${labFooter()}`}
function result(){return `<div class="badge">✓</div><div class="eyebrow">Миссия выполнена</div><h2>Теперь это понятнее.</h2><p>${c().topic}</p><div class="concept">${c().takeaway}</div><p>${s().finalFirstTry?'Новую задачу удалось решить с первой попытки без возврата к материалам.':'Новая задача решена после дополнительной работы или обращения к материалам. Повтори навык завтра.'}</p><div class="actions"><button class="btn primary" data-view="home">Другие дисциплины →</button><button class="btn secondary" data-view="progress">Мой прогресс</button><button class="btn plain" data-action="reset">Повторить предмет</button></div>`}
function tutor(){return `<aside class="aside-stack"><section class="card tutor-card"><div class="tutor-head"><div class="tutor-icon">✳</div><div><h3 style="margin:0">Тьютор рядом</h3><span class="small">Сценарный помощник</span></div></div><p>${s().step<3?c().tutor[s().step]:s().step===3?'Попробуй применить принцип в новой ситуации. Подсказки на этом шаге выключены.':'Вернись к теме завтра. Один успешный пример ещё не подтверждает устойчивое освоение.'}</p>${s().step<3?'<button data-action="simple">Объясни на простом примере</button><button data-action="hint">Дай небольшую подсказку</button>':s().step===3?'<button data-action="train">Вернуться к тренировке</button>':''}</section><section class="card"><div class="eyebrow">Маршрут дисциплины</div>${c().skills.map((skill,i)=>`<div class="skill-row"><span class="skill-check ${s().completed.includes(i)?'ok':''}">${s().completed.includes(i)?'●':'○'}</span>${skill}</div>`).join('')}</section><p class="aside-note">${storageOK?'Прогресс каждого предмета сохраняется отдельно в этом браузере.':'Хранение недоступно: прогресс останется только до закрытия страницы.'}</p></aside>`}
function lesson(){const st=s();return `<div class="view"><button class="btn plain back-button" data-view="home">← Все дисциплины</button>${titleRow('Моя дисциплина',c().name,c().topic)}${hero()}<div class="workspace"><section class="card lesson-card" aria-label="Учебное задание"><div class="step-header"><span>${st.step<4?'ШАГ '+(st.step+1)+' ИЗ 4':'МИССИЯ ЗАВЕРШЕНА'}</span><span>${st.completed.length}/4 пройдено</span></div><div class="track">${[0,1,2,3].map(i=>`<span class="${st.completed.includes(i)?'done':st.step===i?'current':''}"></span>`).join('')}</div>${st.step===4?result():st.step===2?({python:labPython,math:labMath,tech:labTech,service:labService})[active]():question()}</section>${tutor()}</div></div>`}
function progress(){return `<div class="view">${titleRow('Личный маршрут','Мой прогресс','Результаты сохраняются отдельно по каждой дисциплине.')}<div class="course-grid">${ids.map(id=>{const d=courses[id],st=all[id];return `<section class="card"><div class="eyebrow">${d.tag}</div><h2 style="margin-top:10px">${d.name}</h2>${d.skills.map((x,i)=>`<div class="skill-row"><span class="skill-check ${st.completed.includes(i)?'ok':''}">${st.completed.includes(i)?'●':'○'}</span>${x}</div>`).join('')}<div class="home-track"><span style="width:${st.completed.length*25}%;background:${d.color}"></span></div><p class="small" style="margin-top:13px">${st.completed.length}/4 шагов · ${st.hints.reduce((a,b)=>a+b,0)} подсказок · ${st.attempts[3]} попыток в новой задаче</p><button class="btn secondary" data-course="${id}">${st.finished?'Посмотреть итог':'Продолжить'} →</button></section>`}).join('')}</div><div class="concept">Следующий шаг после занятия — новая задача через 1–2 дня. Демо не назначает повторение автоматически и не выставляет официальных оценок.</div></div>`}
function library(){return `<div class="view">${titleRow('Короткий справочник','Материалы дисциплины',c().name+' · '+c().topic)}${coursePicker()}<section class="card">${c().library.map(([h,p])=>`<div class="resource-row"><h3>${h}</h3><p>${p}</p></div>`).join('')}<p class="small">Учебные материалы демонстрационные. Перед использованием в учебном процессе их должен утвердить преподаватель.</p><button class="btn primary" data-view="lesson">Вернуться к занятию →</button></section></div>`}
function coursePicker(){return `<div class="subject-tabs" aria-label="Выбор дисциплины">${ids.map(id=>`<button data-select-course="${id}" class="${active===id?'active':''}" aria-pressed="${active===id}">${courses[id].name}</button>`).join('')}</div>`}
function teacher(){const st=s();return `<div class="view">${titleRow('Демонстрационный кабинет','Преподавателю','Один демо-студент · Четыре дисциплины · Без реальных аккаунтов')}<section class="card table-wrap"><h2>Обзор всех дисциплин</h2><table class="wide-table"><thead><tr><th>Дисциплина</th><th>Шаги</th><th>Подсказки</th><th>Самостоятельная задача</th></tr></thead><tbody>${ids.map(id=>{const x=all[id];return `<tr><td>${courses[id].name}</td><td>${x.completed.length}/4</td><td>${x.hints.reduce((a,b)=>a+b,0)}</td><td>${x.completed.includes(3)?x.finalFirstTry?'С первой попытки':'После дополнительной работы':'Ещё не завершена'}</td></tr>`}).join('')}</tbody></table><div class="actions"><button class="btn secondary" data-action="export">↓ Отчёт по всем дисциплинам</button></div></section><div style="margin-top:25px">${coursePicker()}</div><section class="card"><h2>${c().name}: учебная сводка</h2><p>${st.finished?(st.finalFirstTry?'Новая задача решена с первой попытки. Следующий шаг — отложенная проверка.':'Новая задача решена после повторных попыток или обращения к материалам. Предложите ещё один пример.'):st.events.length?'Занятие в процессе. Итоговое освоение пока не подтверждено.':'По этой дисциплине пока нет учебных действий.'}</p><p class="small">${st.reviewed?'Зафиксирован возврат к справочнику или тренировке во время самостоятельной проверки. ':''}Наблюдения относятся только к этой демосессии.</p><div class="table-wrap">${st.events.length?`<table class="wide-table"><thead><tr><th>Время</th><th>Событие</th><th>Подробности</th></tr></thead><tbody>${st.events.slice().reverse().slice(0,15).map(e=>`<tr><td>${new Date(e.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(({answer:'Ответ',hint:'Подсказка',completed:'Шаг завершён',lab:'Практика',tests:'Проверка',training:'Повторение',reference:'Справочник',reply:'Диалог'})[e.type]||e.type)}</td><td>${esc(e.detail)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Журнал появится после первого действия.</div>'}</div><button class="btn plain" data-action="reset">Сбросить только «${c().name}»</button></section></div>`}
function render(){document.documentElement.style.setProperty('--green',view==='lesson'?c().color:'#21614c');document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});document.getElementById('crumb').textContent=({home:'Мои дисциплины',lesson:c().name,progress:'Мой прогресс',library:'Материалы',teacher:'Преподавателю'})[view];document.querySelector('.course-name').textContent=c().name;document.querySelector('.course-meta').textContent=c().tag;document.getElementById('content').innerHTML=({home,lesson,progress,library,teacher})[view]();}
function check(){const st=s(),q=st.step===3?c().final:c().questions[st.step];if(done()||st.selected[st.step]===undefined)return;const n=number(st.answers.final);if(q.label&&(!Number.isFinite(n)||n<0)){msg('Введи неотрицательное число. Можно использовать запятую или точку.','warn');render();return}st.attempts[st.step]++;const good=st.selected[st.step]===q.correct&&(!q.label||Math.abs(n-q.value)<1e-8);log('answer',c().skills[st.step]+': '+(good?'верно':'пока неверно'));if(good){if(st.step===3)st.finalFirstTry=st.attempts[3]===1&&!st.reviewed&&!st.answers.returnedToTraining;finishStep();msg(q.success,'success')}else msg(st.step===3?'Пока не совпало. Перепроверь условие и свой ответ. Можно попробовать снова или вернуться к тренировке.':q.retry,'warn');render()}
function calc(n){return ({'>':n>1000,'>=':n>=1000,'<':n<1000,'==':n===1000})[s().operator]?Math.round(n*90)/100:n}
function labCheck(){if(done())return;const st=s();let good=false,detail='';if(active==='python'){st.lab.rows=[999,1000,1001,1500].map(n=>({n,actual:calc(n),expected:n>=1000?Math.round(n*90)/100:n}));good=st.lab.rows.every(r=>r.actual===r.expected);detail=good?'4 из 4 проверок пройдены':'Сравни результат с ожиданием. Проверь саму границу.'}if(active==='math'){const n=number(st.lab.answer);if(!Number.isFinite(n)){msg('Сначала введи значение стороны x.','warn');render();return}good=n===10;detail=good?'Верно: x = 10 м, вторая сторона тоже 10 м. Площадь — 100 м².':'Проверь, при каком x производная меняет знак. Введи длину стороны, а не площадь.'}if(active==='tech'){if(sizes.some((_,i)=>!st.lab.parts?.[i])){msg('Выбери решение для каждой из четырёх деталей.','warn');render();return}good=sizes.every((n,i)=>st.lab.parts[i]===(n>=19.8&&n<=20.2?'yes':'no'));detail=good?'Все решения верны: 19,8 и 20,2 мм подходят; 19,7 и 20,3 мм выходят за допуск.':'Есть несовпадения. Сравни каждый размер с обеими границами, включая сами границы.'}st.attempts[2]++;st.labPassed=good;log('tests',detail);if(good)finishStep();msg(detail,good?'success':'warn');render()}
function reply(n){const st=s(),i=st.lab.turn??0,d=dialogs[i];if(!d||done())return;st.attempts[2]++;log('reply',`Реплика ${i+1}: ${n===d.correct?'верно':'нужна другая формулировка'}`);if(n===d.correct){st.lab.history=st.lab.history||[];st.lab.history.push({you:d.options[n],reply:d.reply});st.lab.turn=i+1;st.labRuns++;msg(d.explain,'success');if(st.lab.turn===3){st.labPassed=true;finishStep()}}else msg(n===0&&i===0?'Клиенту важен цвет. Не обесценивай его запрос. Попробуй признать неудобство.':'Эта реплика не помогает уточнить ситуацию или обещает непроверенный результат. Выбери нейтральный следующий шаг.','warn');save();render()}
let modalReturn=null;
function resetModal(){modalReturn=document.activeElement;document.getElementById('modal').innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title"><h2 id="reset-title">Повторить дисциплину?</h2><p>Прогресс по предмету «${c().name}» будет сброшен. Результаты остальных дисциплин сохранятся.</p><div class="actions"><button class="btn secondary" data-action="cancel">Отмена</button><button class="btn primary" data-action="confirm-reset">Начать заново</button></div></section>`;document.getElementById('modal').classList.remove('hidden');document.querySelector('[data-action="cancel"]').focus()}
function closeModal(){document.getElementById('modal').classList.add('hidden');modalReturn?.focus()}
function exportReport(){const report={app:'Мой колледж',version:2,exportedAt:new Date().toISOString(),demo:true,courses:Object.fromEntries(ids.map(id=>[id,{subject:courses[id].name,topic:courses[id].topic,...all[id]}]))};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-college-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Отчёт по четырём дисциплинам подготовлен.')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const st=s();if(b.dataset.course){goCourse(b.dataset.course);return}if(b.dataset.selectCourse){active=b.dataset.selectCourse;feedback=null;if(view==='library'&&s().step===3&&!done()){s().reviewed=true;log('reference','Открыт справочник во время самостоятельной проверки')}save();render();return}if(b.dataset.view){if(b.dataset.view==='library'&&st.step===3&&!done()){st.reviewed=true;log('reference','Открыт справочник во время самостоятельной проверки')}view=b.dataset.view;feedback=null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.choice!==undefined){if(done())return;st.selected[st.step]=Number(b.dataset.choice);feedback=null;save();render();return}if(b.dataset.reply!==undefined){reply(Number(b.dataset.reply));return}const a=b.dataset.action;if(a==='check')check();if(a==='lab-check')labCheck();if((a==='hint'||a==='simple')&&st.step<3){st.hints[st.step]++;log('hint',a==='hint'?'Подсказка':'Простой пример');const h=c()[a==='hint'?'hints':'simple'][st.step];let text=h;if(Array.isArray(h)){st.ladder=st.ladder||{};const used=st.ladder[st.step]||0,lvl=Math.min(used,h.length-1);st.ladder[st.step]=used+1;text=used>=h.length?'Подсказки закончились. Нажми «Объясни на простом примере» или загляни в «Материалы».':/^(Пример|Мысал)/.test(h[lvl])?h[lvl]:['Намёк','Вопрос','Пример'][lvl]+': '+h[lvl]}msg(text);save();render()}if(a==='next'&&done()){st.step++;if(st.step===4)st.finished=true;feedback=null;save();render();document.querySelector('.workspace').scrollIntoView({behavior:'smooth',block:'start'})}if(a==='run'){const n=number(st.lab.total??1000);if(!Number.isFinite(n)||n<0||n>1000000){toast('Введи сумму от 0 до 1 000 000 ₸.');return}st.lab.result=calc(n);st.labRuns++;log('lab',fmt(n)+' ₸ → '+fmt(st.lab.result)+' ₸');render()}if(a==='train'){st.answers.returnedToTraining=true;st.reviewed=true;st.step=2;feedback=null;log('training','Возврат к практике');render()}if(a==='reset')resetModal();if(a==='cancel')closeModal();if(a==='confirm-reset'){all[active]=fresh();feedback=null;view='lesson';save();closeModal();render();toast('Прогресс этой дисциплины сброшен.')}if(a==='export')exportReport()});
document.addEventListener('input',e=>{const el=e.target,st=s();if(el.id==='final-answer')st.answers.final=el.value;if(el.id==='total')st.lab.total=el.value;if(el.id==='math-answer')st.lab.answer=el.value;if(el.id==='yard-x'){st.lab.x=Number(el.value);document.getElementById('yard-value').textContent=fmt(st.lab.x);document.getElementById('math-preview').innerHTML=mathPreview()}if(el.id==='measure'){st.lab.measure=Number(el.value);document.getElementById('measure-preview').innerHTML=measurePreview()}save()});
document.addEventListener('change',e=>{const el=e.target,st=s();if(el.id==='operator'&&!done()){st.operator=el.value;delete st.lab.rows;delete st.lab.result;feedback=null;save();render()}if(el.dataset.part!==undefined&&!done()){st.lab.parts=st.lab.parts||{};st.lab.parts[el.dataset.part]=el.value;save()}if(['yard-x','measure'].includes(el.id)){st.labRuns++;log('lab',el.id==='yard-x'?`Сторона ${st.lab.x} м`:`Размер ${st.lab.measure} мм`)}});
document.addEventListener('keydown',e=>{const modal=document.getElementById('modal');if(modal.classList.contains('hidden'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const bs=modal.querySelectorAll('button');if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs[bs.length-1].focus()}else if(!e.shiftKey&&document.activeElement===bs[bs.length-1]){e.preventDefault();bs[0].focus()}}});
save();render();

<script>
// Telegram Mini App: запускается только внутри Telegram, в обычном браузере прототип работает как раньше
(function(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(!tg||!tg.initData)return;
  document.documentElement.classList.add('in-telegram');
  tg.ready();tg.expand();
  // Свайп вниз при прокрутке урока не сворачивает приложение
  if(tg.isVersionAtLeast('7.7'))tg.disableVerticalSwipes();
  const paint=()=>{const c=tg.colorScheme==='dark'?'#121916':'#f5f6f1';try{tg.setHeaderColor(c);tg.setBackgroundColor(c)}catch(e){}};
  paint();tg.onEvent('themeChanged',paint);
  // Имя только для приветствия; личность студента подтверждает сервер по initData (задача #5)
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u&&u.first_name){
    const name=document.querySelector('.profile span'),ava=document.querySelector('.profile .avatar');
    name.textContent=u.first_name;
    ava.textContent=(u.first_name[0]+(u.last_name?u.last_name[0]:'')).toUpperCase();
    ava.setAttribute('aria-label','Профиль '+u.first_name);
  }
  // Системная кнопка «Назад» Telegram возвращает в каталог
  const baseRender=render;
  render=function(){baseRender();view==='home'?tg.BackButton.hide():tg.BackButton.show()};
  tg.BackButton.onClick(()=>{view='home';feedback=null;render();window.scrollTo({top:0})});
  render();
})();
</script>
<script>
// Казахский язык (#15): переключатель РУС / ҚАЗ; переводы — app/i18n.js.
// По умолчанию — язык Telegram (language_code kk), выбор запоминается в этом браузере.
(function(){
  const KK=window.I18N_KK;if(!KK)return;
  const LANG_KEY='my-college-lang';
  let lang=null;
  try{lang=localStorage.getItem(LANG_KEY)}catch(e){}
  if(lang!=='ru'&&lang!=='kk'){const tg=window.Telegram&&window.Telegram.WebApp,u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;lang=u&&/^kk/i.test(u.language_code||'')?'kk':'ru'}
  const sw=document.createElement('div');
  sw.className='lang-switch';sw.setAttribute('role','group');sw.setAttribute('aria-label','Язык · Тіл');
  sw.innerHTML='<button type="button" data-lang="ru">РУС</button><button type="button" data-lang="kk">ҚАЗ</button>';
  sw.querySelectorAll('button').forEach(b=>{const on=b.dataset.lang===lang;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});
  document.querySelector('.topbar').insertBefore(sw,document.querySelector('.profile'));
  sw.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===lang)return;try{localStorage.setItem(LANG_KEY,b.dataset.lang)}catch(err){}location.reload()});
  if(lang!=='kk')return;
  document.documentElement.lang='kk';
  // Уроки: казахские тексты поверх courses, структура и ответы не меняются
  const merge=(to,from)=>{for(const k in from){const v=from[k];
    if(Array.isArray(v)&&Array.isArray(to[k]))v.forEach((x,i)=>{if(x&&typeof x==='object'&&!Array.isArray(x)&&to[k][i]&&typeof to[k][i]==='object')merge(to[k][i],x);else to[k][i]=x});
    else if(v&&typeof v==='object'&&!Array.isArray(v)&&to[k])merge(to[k],v);else to[k]=v}};
  for(const id in KK.courses)if(courses[id])merge(courses[id],KK.courses[id]);
  // Интерфейс: перевод текстов и подписей после каждой отрисовки
  const tr=s=>{if(KK.ui[s]!==undefined)return KK.ui[s];for(const [re,to] of KK.patterns){const m=s.match(re);if(m)return to.replace(/\{(\d)\}/g,(_,i)=>tr(m[+i]))}return s};
  const cyr=/[А-Яа-яЁё]/;
  const translate=root=>{if(!root)return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode())){const v=n.nodeValue,s=v.trim();if(!s||!cyr.test(s)||n.parentElement.closest('script,style'))continue;const r=tr(s);if(r!==s)n.nodeValue=v.replace(s,r)}
    root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(v&&cyr.test(v)){const r=tr(v);if(r!==v)el.setAttribute(a,r)}}))};
  const baseRender=render;render=function(){baseRender();translate(document.body)};
  const baseToast=toast;toast=function(text){baseToast(tr(String(text)))};
  const baseModal=resetModal;resetModal=function(){baseModal.apply(this,arguments);translate(document.getElementById('modal'))};
  document.title=tr(document.title);
  render();
})();
</script>
